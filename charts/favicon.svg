      <stop offset="0.45" stop-color="#244a6c" />
      <stop offset="0.7" stop-color="#2f5f8a" />
      <stop offset="1" stop-color="#c2698a" />
    </linearGradient>
    <clipPath id="caps"><rect x="0" y="23" width="64" height="19" /></clipPath>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#g)" />
